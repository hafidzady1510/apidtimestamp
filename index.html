<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generator GPS Map Camera Realistis</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      margin: 0;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; font-size: 1.2rem; color: #38bdf8; }
    
    .paste-box {
      border: 2px dashed #0284c7;
      background: rgba(2, 132, 199, 0.1);
      border-radius: 8px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .paste-box p { margin: 0; color: #38bdf8; font-weight: bold; }
    .paste-box span { font-size: 0.8rem; color: #94a3b8; display: block; margin-top: 4px; }
    
    label { font-size: 0.85rem; font-weight: 600; color: #94a3b8; display: block; margin-top: 10px; }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-generate { background: #0284c7; color: white; }
    .btn-generate:hover { background: #0369a1; }
    .btn-reset { background: #ef4444; color: white; }
    .btn-reset:hover { background: #dc2626; }

    #previewArea { margin-top: 20px; text-align: center; }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    .btn-download {
      background: #10b981;
      color: white;
      width: 100%;
      margin-top: 12px;
      display: none;
    }
    .btn-download:hover { background: #059669; }
  </style>
</head>
<body>

<div class="card">
  <h2>📸 Generator GPS Map Camera</h2>

  <div class="paste-box" id="pasteBox" tabindex="0">
    <p>📋 Klik di sini lalu tekan Ctrl + V</p>
    <span>(Paste screenshot halaman admin)</span>
  </div>

  <label>Edit Timestamp Tanggal & Jam Bawah:</label>
  <input type="text" id="dateInput" value="30/10/2026 08:41 GMT+07">

  <div class="btn-group">
    <button class="btn-generate" onclick="generatePhoto()">⚡ Generate Foto</button>
    <button class="btn-reset" onclick="resetAll()">🗑️ Hapus / Ganti Foto</button>
  </div>

  <div id="previewArea">
    <canvas id="outputCanvas" style="display:none;"></canvas>
    <button id="downloadBtn" class="btn-download" onclick="downloadResult()">⬇️ Download Hasil Foto</button>
  </div>
</div>

<script>
  let userImage = null;
  const canvas = document.getElementById('outputCanvas');
  const ctx = canvas.getContext('2d');

  // Load Foto Template Fisik Asli (Frame laptop + Kompas + Baris GPS Asli)
  const baseTemplate = new Image();
  baseTemplate.crossOrigin = "anonymous";
  // Menggunakan source foto referensi yang presisi
  baseTemplate.src = "https://lh3.googleusercontent.com/d/1_contoh_id"; // Opsional jika di-hosting di Drive, jika lokal di-cache otomatis

  // Listener Paste (Ctrl + V)
  window.addEventListener('paste', function(e) {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (let index in items) {
      const item = items[index];
      if (item.kind === 'file' && item.type.startsWith('image/')) {
        const blob = item.getAsFile();
        const reader = new FileReader();
        reader.onload = function(evt) {
          userImage = new Image();
          userImage.onload = function() {
            const pasteBox = document.getElementById('pasteBox');
            pasteBox.style.background = "rgba(16, 185, 129, 0.15)";
            pasteBox.style.borderColor = "#10b981";
            pasteBox.innerHTML = `<p style="color: #34d399;">✅ Screenshot Masuk!</p><span>Siap diproses</span>`;
            generatePhoto();
          };
          userImage.src = evt.target.result;
        };
        reader.readAsDataURL(blob);
        break;
      }
    }
  });

  function generatePhoto() {
    if (!userImage) {
      alert("Silakan tekan Ctrl+V dulu untuk menempelkan screenshot!");
      return;
    }

    // Resolusi portrait identik dengan Foto 2 (768 x 1024)
    const W = 768;
    const H = 1024;
    canvas.width = W;
    canvas.height = H;

    // 1. BEZEL FISIK ATAS LAPTOP (Plastik Matte + Kamera)
    ctx.fillStyle = "#1e2024";
    ctx.fillRect(0, 0, W, 72);

    // Tekstur bintik mikro bezel laptop
    ctx.fillStyle = "rgba(255,255,255,0.03)";
    for (let i = 0; i < 350; i++) {
      ctx.fillRect(Math.random() * W, Math.random() * 72, 1.5, 1.5);
    }

    // Web camera sensor
    ctx.fillStyle = "#0c0d0e";
    ctx.beginPath();
    ctx.arc(W / 2, 36, 6, 0, Math.PI * 2);
    ctx.fill();

    // 2. TEMPEL SCREENSHOT KE MONITOR DENGAN DISTORSI KAMERA HP ASLI
    const screenX = 0;
    const screenY = 72;
    const screenW = W;
    const screenH = H - 72;

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(0.006); // Kemiringan 0.35 derajat natural genggaman tangan

    const sRatio = userImage.width / userImage.height;
    let dW = W * 1.05;
    let dH = dW / sRatio;
    if (dH < screenH) {
      dH = screenH * 1.05;
      dW = dH * sRatio;
    }

    ctx.drawImage(userImage, -dW / 2, -dH / 2 + 12, dW, dH);

    // Efek Scanline / Piksel Layar Monitor Difoto HP
    ctx.fillStyle = "rgba(0, 0, 0, 0.045)";
    for (let y = -H / 2; y < H / 2; y += 2.2) {
      ctx.fillRect(-dW / 2, y, dW, 1.1);
    }

    // Efek Pencahayaan / Vignette Kamera HP
    const vig = ctx.createRadialGradient(0, 0, W * 0.25, 0, 0, W * 0.7);
    vig.addColorStop(0, "rgba(255,255,255,0.04)");
    vig.addColorStop(0.85, "rgba(0,0,0,0.12)");
    vig.addColorStop(1, "rgba(0,0,0,0.32)");
    ctx.fillStyle = vig;
    ctx.fillRect(-dW / 2, -dH / 2, dW, dH);
    ctx.restore();

    // 3. KOMPAS ASLI (179° S - Merah Menunjuk ke Bawah)
    drawCompass(W - 110, 110);

    // 4. WATERMARK GPS MAP CAMERA ASLI & TANGGAL
    drawGPSMapBar(W, H, document.getElementById('dateInput').value);

    canvas.style.display = "block";
    document.getElementById('downloadBtn').style.display = "block";
  }

  // Kompas 179° S
  function drawCompass(x, y) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, 44, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.28)";
    ctx.fill();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
    ctx.stroke();

    // Crosshair halus
    ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - 44, y); ctx.lineTo(x + 44, y);
    ctx.moveTo(x, y - 44); ctx.lineTo(x, y + 44);
    ctx.stroke();

    // Jarum Merah (Arah Selatan 179°)
    ctx.beginPath();
    ctx.moveTo(x, y + 38);
    ctx.lineTo(x + 8, y);
    ctx.lineTo(x - 8, y);
    ctx.fillStyle = "#ef4444";
    ctx.fill();

    // Jarum Putih
    ctx.beginPath();
    ctx.moveTo(x, y - 38);
    ctx.lineTo(x + 8, y);
    ctx.lineTo(x - 8, y);
    ctx.fillStyle = "#ffffff";
    ctx.fill();

    // Teks Derajat
    ctx.font = "bold 19px Arial, sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(0,0,0,0.9)";
    ctx.shadowBlur = 4;
    ctx.fillText("179° S", x, y + 68);
    ctx.restore();
  }

  // Bar GPS Map Camera Presisi Sesuai Referensi
  function drawGPSMapBar(W, H, dateText) {
    const barH = 195;
    const barY = H - barH;

    // Badge "GPS Map Camera"
    const badgeW = 210;
    const badgeH = 36;
    ctx.fillStyle = "rgba(24, 24, 27, 0.9)";
    ctx.fillRect(W - badgeW - 8, barY - badgeH, badgeW, badgeH);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("📷 GPS Map Camera", W - (badgeW / 2) - 8, barY - 12);

    // Bar Gelap Transparan
    ctx.fillStyle = "rgba(12, 12, 12, 0.65)";
    ctx.fillRect(0, barY, W, barH);

    // Kotak Mini Map Asli
    const mapW = 185;
    const mapH = barH - 24;
    const mapX = 10;
    const mapY = barY + 12;

    // Peta Dasar
    ctx.fillStyle = "#f3f4f6";
    ctx.fillRect(mapX, mapY, mapW, mapH);

    // Jalanan & Label Peta
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(mapX, mapY + 45); ctx.lineTo(mapX + mapW, mapY + 115);
    ctx.moveTo(mapX + 55, mapY); ctx.lineTo(mapX + 85, mapY + mapH);
    ctx.stroke();

    ctx.fillStyle = "#64748b";
    ctx.font = "bold 9px Arial";
    ctx.textAlign = "left";
    ctx.fillText("Jl. Mayor", mapX + 8, mapY + 70);
    ctx.fillText("Suryotomo", mapX + 8, mapY + 84);

    // Pin Merah Peta
    const pinX = mapX + 95;
    const pinY = mapY + 68;
    ctx.fillStyle = "#dc2626";
    ctx.beginPath();
    ctx.arc(pinX, pinY, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(pinX, pinY, 5, 0, Math.PI * 2);
    ctx.fill();

    // Teks Informasi (Font & Kerning sama dengan referensi)
    const textX = mapX + mapW + 16;
    ctx.textAlign = "left";
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(0,0,0,0.85)";
    ctx.shadowBlur = 3;

    // 1. Kota
    ctx.font = "bold 23px Arial, sans-serif";
    ctx.fillText("Kota Yogyakarta, Daerah Istimewa", textX, barY + 38);

    // 2. Alamat
    ctx.font = "normal 16px Arial, sans-serif";
    ctx.fillText("Jl. Mayor Suryotomo No.26, Ngupasan, Kec.", textX, barY + 72);
    ctx.fillText("Gondomanan, Kota Yogyakarta, Daerah", textX, barY + 98);

    // 3. Koordinat
    ctx.font = "normal 18px Arial, sans-serif";
    ctx.fillText("Lat -7.798406° Long 110.369597°", textX, barY + 134);

    // 4. Timestamp Tanggal & Jam (Custom Input User)
    ctx.font = "bold 22px Arial, sans-serif";
    ctx.fillText(dateText, textX, barY + 172);
  }

  // Tombol Hapus / Ganti Foto
  function resetAll() {
    userImage = null;
    canvas.style.display = "none";
    document.getElementById('downloadBtn').style.display = "none";

    const pasteBox = document.getElementById('pasteBox');
    pasteBox.style.background = "rgba(2, 132, 199, 0.1)";
    pasteBox.style.borderColor = "#0284c7";
    pasteBox.innerHTML = `
      <p>📋 Klik di sini lalu tekan Ctrl + V</p>
      <span>(Paste screenshot halaman admin)</span>
    `;
  }

  function downloadResult() {
    const link = document.createElement('a');
    link.download = 'GPS_PHOTO_' + Date.now() + '.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
  }
</script>

</body>
</html>
